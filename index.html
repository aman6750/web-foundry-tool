<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Professional Tech Solutions | Web Development, Cloud & AI Services</title>
    <meta name="description" content="Transform your business with cutting-edge web development, cloud solutions, IT consulting, and AI automation. Professional tech services with 500+ successful projects delivered." />
    <meta name="keywords" content="web development, cloud solutions, IT consulting, AI automation, tech services, business automation, scalable websites, cloud migration" />
    <meta name="author" content="TechSolutions Pro" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Professional Tech Solutions | Web Development, Cloud & AI Services" />
    <meta property="og:description" content="Transform your business with cutting-edge web development, cloud solutions, IT consulting, and AI automation. Professional tech services with 500+ successful projects delivered." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com" />
    <meta property="og:image" content="https://yourdomain.com/og-image.jpg" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Professional Tech Solutions | Web Development, Cloud & AI Services" />
    <meta name="twitter:description" content="Transform your business with cutting-edge web development, cloud solutions, IT consulting, and AI automation." />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourdomain.com" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TechSolutions Pro",
      "description": "Professional technology solutions including web development, cloud services, IT consulting, and AI automation",
      "url": "https://yourdomain.com",
      "logo": "https://yourdomain.com/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-555-123-4567",
        "contactType": "customer service",
        "email": "hello@techsolutions.com"
      },
      "service": [
        {
          "@type": "Service",
          "name": "Web Development",
          "description": "Scalable websites and web applications"
        },
        {
          "@type": "Service", 
          "name": "Cloud Solutions",
          "description": "Secure hosting and cloud migration services"
        },
        {
          "@type": "Service",
          "name": "IT Consulting", 
          "description": "Strategic technology consulting and expertise"
        },
        {
          "@type": "Service",
          "name": "AI & Automation",
          "description": "Intelligent automation for business efficiency"
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
